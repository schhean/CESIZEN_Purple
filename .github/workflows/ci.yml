name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality-build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cesizen_ci?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: cesizen-ci-secret-not-used-in-production

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v7

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Installer une version stable de npm
        run: npm install --global npm@11.11.0

      - name: Afficher les versions utilisées
        run: |
          node --version
          npm --version

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la qualité du code
        run: npm run lint

      - name: Vérifier les types TypeScript
        run: npm run typecheck

      - name: Lancer les tests unitaires et de non-régression
        run: npm run test:ci

      - name: Compiler l’application
        run: npm run build

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Lancer les tests fonctionnels
        run: npm run test:functional

      - name: Publier le rapport Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7